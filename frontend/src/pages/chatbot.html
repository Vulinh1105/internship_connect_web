<body data-root="../../"><header class="top"><div class="bar"><a class="brand" href="../../index.html"><img src="../assets/logo-neu.png" alt="" width="44" height="44"><span>Kết nối thực tập NEU</span></a><nav id="nav"></nav></div></header>
<main class="chat-layout"><h1>Bạn cần tìm hiểu điều gì?</h1><p class="muted">Hỏi về thực tập và các tài liệu do nhà trường cung cấp. Câu trả lời đi kèm nguồn khi tìm được bằng chứng.</p>
<p id="chatStatus" role="status" class="notice"></p><div class="card chat-history" id="messages" aria-live="polite"><p class="muted">Bắt đầu bằng câu hỏi của bạn.</p></div>
<form class="card row" id="assistantForm"><label class="sr-only" for="message">Câu hỏi</label><input id="message" required minlength="2" maxlength="1000" placeholder="Ví dụ: Quy trình đăng ký thực tập như thế nào?" style="flex:1;min-width:200px"><button class="primary" id="sendMessage">Gửi câu hỏi</button></form>
</main><div id="toast" role="status"></div><script src="../api/client.js"></script><script src="../lib/auth.js"></script><script src="../lib/ui.js"></script><script src="../features/chatbot.js"></script></body></html>
