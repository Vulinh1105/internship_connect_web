<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ sinh viên · Kết nối thực tập NEU</title>
<link rel="stylesheet" href="../styles/style.css">
<link rel="icon" href="../assets/logo-neu.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
</head>
<body data-page="student" data-root="../../">
<header class="top"><div class="bar"><a class="brand" href="../../index.html"><img src="../assets/logo-neu.png" alt="" width="44" height="44"><span>Kết nối thực tập NEU</span></a><nav id="nav"></nav></div></header>
<main>
<h1>Hồ sơ sinh viên</h1>
<form class="card" id="profileForm"><p id="profileNote" class="muted"></p>
  <div class="grid cols-2">
    <div><label for="full_name">Họ tên *</label><input id="full_name" required maxlength="255"></div>
    <div><label for="student_code">Mã sinh viên</label><input id="student_code" maxlength="20"></div>
    <div><label for="major">Ngành học</label><input id="major" maxlength="255"></div>
    <div><label for="gpa">Điểm trung bình (0–10)</label><input id="gpa" type="number" step="0.01" min="0" max="10"></div>
    <div><label for="phone">Số điện thoại</label><input id="phone" maxlength="20"></div>
    <div><label for="internship_status">Tình trạng thực tập</label><select id="internship_status">
      <option value="not_started">Chưa bắt đầu</option><option value="searching">Đang tìm</option>
      <option value="interning">Đang thực tập</option><option value="completed">Đã hoàn thành</option></select></div>
  </div>
  <label for="profile_summary" style="margin-top:10px">Giới thiệu bản thân</label><textarea id="profile_summary" maxlength="5000"></textarea>
  <p><button class="primary">Lưu hồ sơ</button></p></form>
<div id="hasProfile" style="display:none">
  <div class="card"><h2>Kỹ năng</h2><div id="skills" class="chips"></div>
    <form id="skillForm" class="row" style="margin-top:10px"><input id="skillName" placeholder="Ví dụ: Python" maxlength="100" style="max-width:260px" required><button>Thêm</button></form></div>
  <div class="card"><h2>CV</h2><div id="cvs"></div>
    <form id="cvForm" class="row" style="margin-top:10px"><input id="cvFile" type="file" accept=".pdf,.doc,.docx" style="max-width:320px"><button>Tải lên</button><span class="muted">PDF/DOC/DOCX, tối đa 5MB</span></form></div>
  <div class="card"><h2>Gợi ý vị trí phù hợp</h2><p class="muted">Dựa trên ngành học, kỹ năng và phần giới thiệu trong hồ sơ.</p>
    <button id="recoBtn" class="primary">Lấy gợi ý</button><div id="reco"></div></div>
</div>
<div class="card"><h2>Hỏi đáp về thực tập</h2>
  <form id="chatForm" class="row"><input id="question" placeholder="Ví dụ: Làm sao để rút hồ sơ ứng tuyển?" style="flex:1;min-width:220px" required minlength="2"><button class="primary">Hỏi</button></form>
  <div id="answer"></div></div>
</main>
<div id="toast" role="status"></div>
<script src="../api/client.js"></script>
<script src="../lib/auth.js"></script>
<script src="../lib/ui.js"></script>
<script src="../features/home.js"></script>
<script src="../features/auth.js"></script>
<script src="../features/internships.js"></script>
<script src="../features/student-profile.js"></script>
<script src="../features/applications.js"></script>
<script src="../features/company.js"></script>
<script src="../app/bootstrap.js"></script>
</body>
</html>
