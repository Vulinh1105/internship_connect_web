<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Kết nối thực tập NEU</title>
<link rel="stylesheet" href="../styles/style.css">
<link rel="icon" href="../assets/logo-neu.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
</head>
<body data-page="login" data-root="../../">
<header class="top"><div class="bar"><a class="brand" href="../../index.html"><img src="../assets/logo-neu.png" alt="" width="44" height="44"><span>Kết nối thực tập NEU</span></a><nav id="nav"></nav></div></header>
<main>
<h1>Đăng nhập để bắt đầu thực tập</h1>
<div class="grid cols-2">
  <form class="card" id="loginForm"><h2>Đăng nhập</h2>
    <label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="username">
    <label for="lPass" style="margin-top:10px">Mật khẩu</label><input id="lPass" type="password" required autocomplete="current-password">
    <p><button class="primary">Đăng nhập</button></p>
  <form class="card" id="registerForm"><h2>Đăng ký</h2>
    <label for="rEmail">Email</label><input id="rEmail" type="email" required autocomplete="username">
    <label for="rPass" style="margin-top:10px">Mật khẩu (tối thiểu 8 ký tự)</label><input id="rPass" type="password" minlength="8" required autocomplete="new-password">
    <label for="rRole" style="margin-top:10px">Bạn là</label>
    <select id="rRole"><option value="student">Sinh viên</option><option value="company">Doanh nghiệp</option></select>
    <p><button class="primary">Tạo tài khoản</button></p>
  </form>
</div>
</main>
<div id="toast" role="status"></div>
<script src="../api/client.js"></script>
<script src="../lib/auth.js"></script>
<script src="../lib/ui.js"></script>
<script src="../features/home.js"></script>
<script src="../features/auth.js"></script>
<script src="../features/internships.js"></script>
<script src="../features/student-profile.js"></script>
<script src="../features/applications.js"></script>
<script src="../features/company.js"></script>
<script src="../app/bootstrap.js"></script>
</body>
</html>
