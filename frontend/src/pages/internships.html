<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vị trí thực tập · Kết nối thực tập NEU</title>
<link rel="stylesheet" href="../styles/style.css">
<link rel="icon" href="../assets/logo-neu.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
</head>
<body data-page="internships" data-root="../../">
<header class="top"><div class="bar"><a class="brand" href="../../index.html"><img src="../assets/logo-neu.png" alt="" width="44" height="44"><span>Kết nối thực tập NEU</span></a><nav id="nav"></nav></div></header>
<main>
<h1>Vị trí thực tập</h1>
<form class="card row" id="searchForm">
  <div style="flex:2;min-width:200px"><label for="q">Từ khóa</label><input id="q" placeholder="Python, marketing, tên công ty..."></div>
  <div style="flex:1;min-width:160px"><label for="loc">Địa điểm</label><input id="loc" placeholder="Hà Nội"></div>
  <div style="align-self:end"><button class="primary">Tìm</button></div>
</form>
<div class="card"><div id="list"><p class="muted">Đang tải...</p></div>
  <div class="row"><button id="prev">← Trước</button><span id="pageInfo" class="muted"></span><button id="next">Sau →</button></div></div>
<dialog id="applyDialog"><form id="applyForm"><h2>Ứng tuyển: <span id="applyTitle"></span></h2>
  <label for="cover">Thư giới thiệu</label><textarea id="cover" maxlength="5000"></textarea>
  <label for="cvSelect" style="margin-top:10px">CV đính kèm</label><select id="cvSelect"></select>
  <p class="row"><button class="primary">Gửi hồ sơ</button><button type="button" id="applyCancel">Hủy</button></p></form></dialog>
</main>
<div id="toast" role="status"></div>
<script src="../api/client.js"></script>
<script src="../lib/auth.js"></script>
<script src="../lib/ui.js"></script>
<script src="../features/home.js"></script>
<script src="../features/auth.js"></script>
<script src="../features/internships.js"></script>
<script src="../features/student-profile.js"></script>
<script src="../features/applications.js"></script>
<script src="../features/company.js"></script>
<script src="../app/bootstrap.js"></script>
</body>
</html>
